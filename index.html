<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우정아, 해피 빼빼로데이 💜</title>
<meta name="description" content="11월 11일, 우정이에게 보내는 빼빼로 한 상자">
<meta property="og:title" content="우정아, 해피 빼빼로데이 💜">
<meta property="og:description" content="11월 11일, 우정이에게 보내는 빼빼로 한 상자">
<meta property="og:image" content="kuromi.png">
<meta name="theme-color" content="#e9dcff">
<link rel="icon" href="kuromi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2e2a33;
    --purple: #a78bfa;
    --purple-deep: #7c5cd6;
    --lav: #e9dcff;
    --pink: #ff8fc0;
    --pink-soft: #ffd6e8;
    --choco: #5a3424;
    --biscuit: #f0c27b;
    --cream: #fffaf5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #ffe3f0 0, transparent 40%),
      radial-gradient(circle at 90% 85%, #dccbff 0, transparent 45%),
      linear-gradient(160deg, #f4ecff 0%, #ffeaf4 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    user-select: none;
  }
  /* 도트 무늬 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(167,139,250,.22) 1.5px, transparent 1.6px);
    background-size: 26px 26px;
    pointer-events: none;
  }

  /* ---------- 인트로: 코를 문질러봐 ---------- */
  body.locked .card { display: none; }
  #intro {
    position: fixed; inset: 0; z-index: 50;
    background: #1c1820;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
    transition: opacity 1s ease;
  }
  #intro.bye { opacity: 0; pointer-events: none; }
  #intro .blurbg {
    position: absolute; inset: -40px;
    background: url(photo.jpg) center/cover;
    filter: blur(28px) brightness(.7);
  }
  .frame {
    position: relative;
    width: min(100vw, calc(100dvh * 880 / 1920));
    aspect-ratio: 880 / 1920;
    overflow: hidden;
  }
  .frame .photo {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    -webkit-user-drag: none; pointer-events: none;
    transition: filter 1.8s ease, transform 1.8s ease;
  }
  .frame.wobble .photo { animation: wobble .35s ease; }
  @keyframes wobble {
    0%,100% { transform: scale(1) rotate(0); }
    30% { transform: scale(1.03) rotate(-1.2deg); }
    70% { transform: scale(1.03) rotate(1.2deg); }
  }
  /* 코 위치 (사진 기준 %) */
  .nose {
    position: absolute; left: 52%; top: 67.5%;
    width: 30%; aspect-ratio: 1; transform: translate(-50%,-50%);
    border-radius: 50%;
    transition: opacity .5s;
  }
  .nose::before, .nose::after {
    content: ""; position: absolute; inset: 8%;
    border: 3px solid #fff; border-radius: 50%;
    box-shadow: 0 0 14px var(--pink), inset 0 0 14px var(--pink);
    animation: ring 1.6s ease-out infinite;
  }
  .nose::after { animation-delay: .8s; }
  @keyframes ring { from { transform: scale(.55); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  .finger {
    position: absolute; left: 50%; top: 58%;
    font-size: clamp(30px, 9vw, 44px); margin-left: -.5em;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.4));
    animation: rub 1.1s ease-in-out infinite;
  }
  @keyframes rub { 0%,100% { transform: translateX(-70%) rotate(-12deg); } 50% { transform: translateX(70%) rotate(12deg); } }
  .rubbing .finger { opacity: 0; }

  .toast {
    position: absolute; left: 50%; top: max(22px, env(safe-area-inset-top));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.95);
    border: 3px solid var(--ink); border-radius: 22px;
    padding: 10px 18px 10px 12px;
    box-shadow: 0 6px 0 var(--ink);
    white-space: nowrap; z-index: 3;
    animation: toastIn .8s .5s cubic-bezier(.2,1.5,.4,1) both;
    transition: opacity .5s;
  }
  @keyframes toastIn { from { transform: translate(-50%, -160%); } to { transform: translate(-50%, 0); } }
  .toast img { width: 44px; height: 36px; object-fit: contain; animation: beat 1.2s ease-in-out infinite; }
  .toast .t1 { font-size: 12px; color: #8d84a0; text-align: left; }
  .toast .t2 { font-size: 20px; text-align: left; }
  .gauge { display: flex; gap: 3px; font-size: 16px; margin-left: 2px; }
  .gauge span { filter: grayscale(1); opacity: .35; transition: all .3s; }
  .gauge span.on { filter: none; opacity: 1; transform: scale(1.3); }

  /* 변신 */
  .morph {
    position: absolute; left: 50%; top: 62%;
    width: 118%; transform: translate(-50%,-50%) scale(.75);
    opacity: 0; pointer-events: none;
    transition: opacity 1.8s ease, transform 1.8s cubic-bezier(.3,1.2,.5,1);
  }
  .morph::before {
    content: ""; position: absolute; inset: -30%;
    background: radial-gradient(circle, #fff 0 38%, rgba(255,240,250,.85) 52%, transparent 70%);
    z-index: -1;
  }
  .morph img { width: 100%; display: block; }
  .changing .photo { filter: blur(14px) brightness(1.25) saturate(.6); transform: scale(1.08); }
  .changing .morph { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .changing .nose, .changing ~ .toast, #intro.done .toast { opacity: 0; }
  .spark {
    position: absolute; pointer-events: none; z-index: 4;
    animation: burst .8s cubic-bezier(.2,.8,.3,1) forwards;
  }

  /* ---------- 떨어지는 빼빼로 / 하트 ---------- */
  #sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .stick {
    position: absolute; top: -160px;
    width: 9px; height: 120px; border-radius: 5px;
    background: linear-gradient(to bottom, var(--c, var(--choco)) 0 76%, var(--biscuit) 76% 100%);
    box-shadow: inset -2px 0 0 rgba(0,0,0,.12), 0 4px 8px rgba(90,52,36,.12);
    animation: fall linear forwards;
    opacity: .9;
  }
  .stick.almond::after {
    content: ""; position: absolute; inset: 0 0 24% 0; border-radius: 5px;
    background-image: radial-gradient(#f6dfb5 1.6px, transparent 1.8px);
    background-size: 6px 9px; background-position: 1px 2px;
  }
  @keyframes fall {
    from { transform: translateY(0) rotate(var(--r0)); }
    to   { transform: translateY(calc(100vh + 320px)) rotate(var(--r1)); }
  }
  .float {
    position: absolute; bottom: -40px;
    animation: rise linear forwards;
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translate(0,0) scale(.6); opacity: 0; }
    15%  { opacity: .85; }
    100% { transform: translate(var(--dx), -110vh) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  /* ---------- 카드 ---------- */
  .card {
    position: relative; z-index: 2;
    width: min(420px, 100%);
    background: rgba(255,255,255,.86);
    backdrop-filter: blur(6px);
    border: 3px solid var(--ink);
    border-radius: 34px;
    padding: 30px 22px 26px;
    text-align: center;
    box-shadow: 0 10px 0 var(--ink), 0 30px 50px rgba(124,92,214,.25);
    animation: cardIn .9s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes cardIn {
    from { transform: translateY(40px) scale(.9); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  /* 쿠로미 귀 모양 장식 */
  .card::before, .card::after {
    content: ""; position: absolute; top: -26px;
    width: 46px; height: 46px; background: var(--ink);
    border-radius: 6px 60% 6px 60%;
    z-index: -1;
  }
  .card::before { left: 34px; transform: rotate(-12deg); }
  .card::after  { right: 34px; transform: rotate(102deg); }

  .badge {
    display: inline-block;
    font-size: 14px; letter-spacing: 1px;
    background: var(--ink); color: #fff;
    padding: 6px 16px; border-radius: 999px;
    animation: pop .6s .5s both;
  }
  .badge b { color: var(--pink); font-weight: 400; }

  /* 11.11 빼빼로 숫자 */
  .eleven {
    display: flex; justify-content: center; align-items: flex-end;
    gap: 12px; height: 104px; margin: 18px 0 6px;
  }
  .big {
    width: 16px; height: 96px; border-radius: 8px;
    background: linear-gradient(to bottom, var(--c) 0 74%, var(--biscuit) 74% 100%);
    border: 2.5px solid var(--ink);
    transform-origin: bottom center;
    animation: drop .8s cubic-bezier(.3,1.6,.5,1) both, sway 2.4s ease-in-out infinite;
  }
  .big:nth-child(1) { --c: var(--choco);  animation-delay: .5s, 1.4s; }
  .big:nth-child(2) { --c: var(--pink);   animation-delay: .65s, 1.7s; }
  .big:nth-child(4) { --c: var(--purple); animation-delay: .8s, 2s; }
  .big:nth-child(5) { --c: var(--choco);  animation-delay: .95s, 2.3s; }
  .dot {
    font-size: 26px; align-self: center; margin: 0 2px;
    animation: beat 1s ease-in-out infinite, pop .5s 1.1s both;
  }
  @keyframes drop {
    from { transform: translateY(-260px) rotate(25deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes beat { 0%,100% { transform: scale(1); } 35% { transform: scale(1.3); } 60% { transform: scale(.95); } }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .sub { font-size: 15px; color: var(--purple-deep); letter-spacing: 3px; }

  /* 쿠로미 */
  .kuromi-wrap { position: relative; margin: 6px auto 0; width: min(280px, 78%); }
  .kuromi-wrap::before {
    content: ""; position: absolute; left: 12%; right: 12%; bottom: 2px; height: 16px;
    background: rgba(46,42,51,.16); border-radius: 50%;
    animation: shadow 2.2s ease-in-out infinite;
  }
  .kuromi {
    position: relative; width: 100%; display: block;
    mix-blend-mode: multiply;
    animation: bob 2.2s ease-in-out infinite;
    cursor: pointer;
  }
  .kuromi.jump { animation: jump .7s cubic-bezier(.3,1.5,.5,1); }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-12px) rotate(3deg); }
  }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.78); opacity: .6; } }
  @keyframes jump {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-34px) scale(1.08) rotate(8deg); }
    100% { transform: translateY(0) scale(1); }
  }

  h1 {
    font-weight: 400; font-size: clamp(30px, 9vw, 40px); line-height: 1.25; margin-top: 8px;
  }
  h1 .name {
    display: inline-block; color: var(--purple-deep);
    background: linear-gradient(transparent 62%, var(--pink-soft) 62%);
    padding: 0 4px;
  }
  h1 .ch { display: inline-block; animation: wave 1.6s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-7px); } 60% { transform: translateY(0); } }

  .love {
    font-size: clamp(22px, 6.5vw, 28px); color: var(--pink); margin-top: 2px;
    text-shadow: 2px 2px 0 var(--ink);
    -webkit-text-stroke: .6px var(--ink);
    animation: beat 1.4s ease-in-out infinite;
  }

  /* 버튼 */
  .btn {
    margin-top: 20px;
    font-family: inherit; font-size: 19px; color: #fff;
    background: var(--purple);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 13px 30px; cursor: pointer;
    box-shadow: 0 6px 0 var(--ink);
    transition: transform .12s, box-shadow .12s, background .2s;
    animation: nudge 2.6s 2.2s ease-in-out infinite;
  }
  .btn:hover { background: var(--purple-deep); }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  @keyframes nudge { 0%,86%,100% { transform: rotate(0); } 89% { transform: rotate(-4deg); } 93% { transform: rotate(4deg); } 97% { transform: rotate(-2deg); } }

  /* 편지 */
  .letter {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .7s cubic-bezier(.3,1,.4,1), margin .7s;
  }
  .letter.open { grid-template-rows: 1fr; margin-top: 20px; }
  .letter > div { overflow: hidden; }
  .paper {
    font-family: 'Gaegu', 'Jua', sans-serif; font-weight: 700;
    font-size: 21px; line-height: 1.65; text-align: left;
    background:
      repeating-linear-gradient(transparent 0 33.6px, rgba(167,139,250,.35) 33.6px 34.65px),
      var(--cream);
    border: 2.5px dashed var(--purple);
    border-radius: 18px;
    padding: 14px 18px 16px;
    min-height: 120px;
    white-space: pre-wrap;
    word-break: keep-all;
  }
  .paper .caret { display: inline-block; width: 2px; height: 1em; background: var(--pink); vertical-align: -2px; animation: blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .from { font-family: 'Gaegu', sans-serif; font-weight: 700; text-align: right; font-size: 18px; color: var(--purple-deep); margin-top: 8px; opacity: 0; transition: opacity .8s; }
  .from.show { opacity: 1; }

  .hint { font-family: 'Gaegu', sans-serif; font-size: 16px; color: #8d84a0; margin-top: 16px; }

  /* 터치 하트 */
  .burst {
    position: fixed; z-index: 9; pointer-events: none;
    animation: burst var(--t, 1s) cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes burst {
    0%   { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }
  .burst.stickb {
    width: 7px; height: 70px; border-radius: 4px;
    background: linear-gradient(to bottom, var(--c) 0 76%, var(--biscuit) 76% 100%);
  }
</style>
</head>
<body class="locked">
  <div id="intro">
    <div class="blurbg"></div>
    <div class="frame" id="frame">
      <img class="photo" src="photo.jpg" alt="" draggable="false">
      <div class="nose" id="nose"><span class="finger">👆</span></div>
      <div class="morph"><img src="kuromi.png" alt=""></div>
    </div>
    <div class="toast">
      <img src="kuromi.png" alt="">
      <div>
        <div class="t1">쿠로미의 알림 · 지금</div>
        <div class="t2">코를 문질러봐! 👃</div>
      </div>
      <div class="gauge" id="gauge"><span>💜</span><span>💜</span><span>💜</span></div>
    </div>
  </div>

  <div id="sky"></div>

  <main class="card">
    <span class="badge">HAPPY <b>PEPERO</b> DAY</span>

    <div class="eleven" aria-label="11월 11일">
      <i class="big"></i><i class="big"></i>
      <span class="dot">💜</span>
      <i class="big"></i><i class="big"></i>
    </div>
    <p class="sub">11 · 11</p>

    <div class="kuromi-wrap">
      <img class="kuromi" id="kuromi" src="kuromi.png" alt="윙크하는 쿠로미">
    </div>

    <h1><span class="name" id="name">이우정</span></h1>
    <p class="love">사랑해 ♥</p>

    <button class="btn" id="btn">빼빼로 받기 💝</button>

    <div class="letter" id="letter">
      <div>
        <p class="paper" id="paper"></p>
        <p class="from" id="from">— 우정이를 제일 사랑하는 남자친구가 💜</p>
      </div>
    </div>

    <p class="hint">화면을 톡톡 눌러봐 ✨</p>
  </main>

<script>
  const sky = document.getElementById('sky');
  const rand = (a, b) => Math.random() * (b - a) + a;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const COLORS = ['#5a3424', '#ff8fc0', '#a78bfa', '#5a3424', '#2e2a33', '#fff3e6'];
  const EMOJI = ['💜', '🖤', '💗', '✨', '💜', '🩷'];

  // 이름 글자 물결
  const nameEl = document.getElementById('name');
  nameEl.innerHTML = [...nameEl.textContent].map((c, i) =>
    `<span class="ch" style="animation-delay:${i * .15}s">${c}</span>`).join('');

  // 떨어지는 빼빼로
  function dropStick() {
    if (document.hidden) return;
    const s = document.createElement('i');
    s.className = 'stick' + (Math.random() < .25 ? ' almond' : '');
    const scale = rand(.55, 1.1);
    s.style.left = rand(0, 100) + 'vw';
    s.style.setProperty('--c', pick(COLORS));
    s.style.setProperty('--r0', rand(-40, 40) + 'deg');
    s.style.setProperty('--r1', rand(-220, 220) + 'deg');
    s.style.width = 9 * scale + 'px';
    s.style.height = 120 * scale + 'px';
    s.style.animationDuration = rand(6, 11) + 's';
    s.addEventListener('animationend', () => s.remove());
    sky.appendChild(s);
  }
  // 떠오르는 하트
  function floatHeart() {
    if (document.hidden) return;
    const h = document.createElement('span');
    h.className = 'float';
    h.textContent = pick(EMOJI);
    h.style.left = rand(0, 100) + 'vw';
    h.style.fontSize = rand(14, 28) + 'px';
    h.style.setProperty('--dx', rand(-60, 60) + 'px');
    h.style.setProperty('--rot', rand(-40, 40) + 'deg');
    h.style.animationDuration = rand(7, 12) + 's';
    h.addEventListener('animationend', () => h.remove());
    sky.appendChild(h);
  }
  function startSky() {
    for (let i = 0; i < 6; i++) setTimeout(dropStick, i * 350);
    setInterval(dropStick, 750);
    setInterval(floatHeart, 900);
  }

  // ----- 인트로: 코를 세 번 문지르면 쿠로미로 변신 -----
  const intro = document.getElementById('intro');
  const frame = document.getElementById('frame');
  const nose = document.getElementById('nose');
  const gauge = [...document.querySelectorAll('#gauge span')];
  const NEED = 3;
  let rubs = 0, dist = 0, last = null, idleTimer = null, finished = false;

  function sparkle(x, y) {
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = pick(['✨', '💜', '💗', '⭐']);
      s.style.fontSize = rand(16, 30) + 'px';
      s.style.left = x + 'px'; s.style.top = y + 'px';
      const a = rand(0, Math.PI * 2), d = rand(50, 120);
      s.style.setProperty('--bx', Math.cos(a) * d + 'px');
      s.style.setProperty('--by', Math.sin(a) * d + 'px');
      s.style.setProperty('--rot', rand(-90, 90) + 'deg');
      s.addEventListener('animationend', () => s.remove());
      intro.appendChild(s);
    }
  }
  function oneRub(x, y) {
    gauge[rubs].classList.add('on');
    rubs++;
    sparkle(x, y);
    frame.classList.remove('wobble'); void frame.offsetWidth; frame.classList.add('wobble');
    if (navigator.vibrate) navigator.vibrate(30);
    if (rubs >= NEED) transform();
  }
  function transform() {
    finished = true;
    frame.classList.add('changing');
    intro.classList.add('done');
    setTimeout(() => {
      document.body.classList.remove('locked');
      startSky();
      intro.classList.add('bye');
      setTimeout(() => intro.remove(), 1100);
    }, 2600);
  }
  intro.addEventListener('pointermove', e => {
    if (finished) return;
    const r = nose.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const inside = Math.hypot(e.clientX - cx, e.clientY - cy) < r.width * .6;
    if (!inside) { last = null; return; }
    if (last) {
      dist += Math.hypot(e.clientX - last.x, e.clientY - last.y);
      frame.classList.add('rubbing');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => frame.classList.remove('rubbing'), 1200);
      if (dist > r.width * 1.3) { dist = 0; oneRub(e.clientX, e.clientY); }
    }
    last = { x: e.clientX, y: e.clientY };
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => intro.addEventListener(t, () => last = null));
  intro.addEventListener('contextmenu', e => e.preventDefault());

  // 터치하면 하트 팡!
  function burst(x, y, n = 8, withSticks = false) {
    for (let i = 0; i < n; i++) {
      const stick = withSticks && i % 3 === 0;
      const b = document.createElement(stick ? 'i' : 'span');
      b.className = 'burst' + (stick ? ' stickb' : '');
      if (stick) b.style.setProperty('--c', pick(COLORS));
      else { b.textContent = pick(EMOJI); b.style.fontSize = rand(16, 34) + 'px'; }
      const ang = rand(0, Math.PI * 2), dist = rand(60, withSticks ? 260 : 130);
      b.style.left = x + 'px'; b.style.top = y + 'px';
      b.style.setProperty('--bx', Math.cos(ang) * dist + 'px');
      b.style.setProperty('--by', Math.sin(ang) * dist - 40 + 'px');
      b.style.setProperty('--rot', rand(-180, 180) + 'deg');
      b.style.setProperty('--t', rand(.8, 1.5) + 's');
      b.addEventListener('animationend', () => b.remove());
      document.body.appendChild(b);
    }
  }
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('#btn') || e.target.closest('#intro')) return;
    burst(e.clientX, e.clientY);
  });

  // 쿠로미 점프
  const kuromi = document.getElementById('kuromi');
  kuromi.addEventListener('pointerdown', () => {
    kuromi.classList.remove('jump'); void kuromi.offsetWidth; kuromi.classList.add('jump');
  });
  kuromi.addEventListener('animationend', e => { if (e.animationName === 'jump') kuromi.classList.remove('jump'); });

  // 편지
  const MESSAGE =
`우정아, 오늘 빼빼로데이야 🍫

빼빼로보다 길~게,
초콜릿보다 달콤하게,
쿠로미보다 깜찍한 너를

오늘도 내일도
아주아주 많이 사랑해 💜`;
  const btn = document.getElementById('btn');
  const letter = document.getElementById('letter');
  const paper = document.getElementById('paper');
  const from = document.getElementById('from');
  let typing = null;

  function typeLetter() {
    clearInterval(typing);
    from.classList.remove('show');
    const chars = [...MESSAGE];
    let i = 0;
    paper.innerHTML = '<span class="caret"></span>';
    typing = setInterval(() => {
      i++;
      paper.textContent = chars.slice(0, i).join('');
      if (i < chars.length) paper.insertAdjacentHTML('beforeend', '<span class="caret"></span>');
      else { clearInterval(typing); from.classList.add('show'); }
    }, 65);
  }

  btn.addEventListener('click', () => {
    const r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 36, true);
    kuromi.classList.remove('jump'); void kuromi.offsetWidth; kuromi.classList.add('jump');
    letter.classList.add('open');
    btn.textContent = '한 번 더 받기 💝';
    typeLetter();
    setTimeout(() => letter.scrollIntoView({ behavior: 'smooth', block: 'center' }), 500);
  });
</script>
</body>
</html>
